      change_summary: "24 fresh instances/distribution, eight LODO codes x four replicas, 200 iterations; dedicated result branch 7b30a2f."
      timestamp: "2026-08-03"

outer_loop:
  cycle: 4
  last_direction: "Move from static instance/distribution memory to incumbent-conditioned online allocation over the full code panel; keep Fisher geometry deferred until this baseline exists."
  last_reflection: "Top-8 selection recovered a small advantage over random fixed codes on five targets, but lost to the full 32-code panel on every target and was significantly harmful on at least one primary metric for all six. Cross-domain code priors are real but too state-dependent to use as a static selector."

