project:
  title: "Automatic Cross-Distribution Adaptation for Neural LNS"
  question: "Can a frozen seed-conditioned NDS reuse latent-code experience across same-size CVRP instances and unseen distributions to reduce search budget?"
  status: active
  started: "2026-08-02"
  domain: "neural combinatorial optimization / learned large-neighborhood search"

literature:
  key_papers:
    - id: nds2025
      title: "Neural Deconstruction Search for Vehicle Routing Problems"
      authors: "Hottung, Wong-Chung, Tierney"
      year: 2025
      relevance: "Backbone learned LNS; reports mild CVRP500 cross-distribution robustness."
    - id: compass2023
      title: "Combinatorial Optimization with Policy Adaptation using Latent Space Search"
      authors: "Chalumeau et al."
      year: 2023
      relevance: "Closest per-instance latent policy search baseline."
    - id: omnivrp2023
      title: "Towards Omni-generalizable Neural Methods for Vehicle Routing Problems"
      authors: "Zhou et al."
      year: 2023
      relevance: "Meta-learning baseline for fast cross-size and cross-distribution adaptation."
    - id: memento2024
      title: "Memory-Enhanced Neural Solvers for Efficient Adaptation in Combinatorial Optimization"
      authors: "Chalumeau et al."
      year: 2024
      relevance: "Memory-based inference-time adaptation baseline."
  open_problems:
    - "Reuse adaptation/search state across different instances instead of restarting latent search."
    - "Detect and reject negative transfer under an unknown distribution shift."
  evidence_gaps:
    - "Whether incumbent/search-state features can safely reweight a full latent panel online without collapsing proposal diversity."
    - "Whether online reweighting can reduce evaluated codes while matching the 32-code panel anytime curve."

hypotheses:
  - id: H0
    statement: "The pretrained NDS binary latent codes have no sufficiently reliable cross-instance performance ordering; apparent transfer is dominated by rollout noise."
    status: rejected
    motivation: "If H0 cannot be rejected, transport geometry has no stable object to move."
    parent: null
    priority: high
  - id: H1
    statement: "A code selected from a feature-nearest source instance improves normalized one-step destroy-repair reward on unseen same-size target distributions relative to a random code."
    status: rejected
    motivation: "This is the minimum evidence that adaptation experience is reusable across instances."
    parent: null
    priority: high
  - id: H1b
    statement: "A code selected by mean calibration reward across several source distributions improves normalized one-step reward on a held-out same-size distribution relative to a random code."
    status: supported
    motivation: "The first pilot rejected uniform-only feature kNN but exploratory leave-one-distribution-out analysis found positive multi-source mean-code gains on all six targets."
    parent: H1
    priority: high
  - id: H3
    statement: "A leave-one-distribution-out multi-source code improves fixed-budget full-LNS final cost and anytime area over a random fixed code on fresh same-size target instances."
    status: rejected
    motivation: "H1b passed on fresh instances, but one-step reward must translate into iterative search quality before claiming an automatically generalizing LNS."
    parent: H1b
    priority: high
  - id: H4
    statement: "A multi-source top-8 latent portfolio, with four stochastic replicas per code, improves equal-budget full-LNS final cost and anytime area over an uninformed 32-code panel on fresh targets."
    status: rejected
    motivation: "Static single-code H3 failed from the first iteration, indicating that calibration must preserve upper-tail rollout diversity rather than maximize mean one-step reward alone."
    parent: H3
    priority: high
  - id: H5
    statement: "Incumbent-conditioned online code reweighting can retain the full candidate panel while allocating rollout replicas to promising codes, matching or improving the 32-code panel with fewer effective code evaluations."
    status: pending
    motivation: "Both single-code and static top-8 memory lost to the 32-code panel; the reusable signal must be conditioned on evolving search state and combined with explicit diversity preservation."
    parent: H4
    priority: high
  - id: H2
    statement: "Fisher-derived similarity predicts transfer regret beyond ordinary instance features and encoder embeddings."
    status: deferred
    motivation: "Only test geometry after H0 is rejected and H1 has positive signal."
    parent: null
    priority: medium

experiments:
  proxy_metric: "Relative gain in normalized one-step reward of source-selected or kNN-retrieved codes over a random-code baseline, with bootstrap confidence intervals; secondary metrics are split-half code-rank reliability and negative-transfer rate."
  baseline_value: "Uniform-only kNN passed the locked OOD criterion on 1/5 targets."
  best_value: "Fresh-seed H1b confirmation passed on 6/6 held-out distributions with +21.4% to +45.3% relative one-step gain and positive bootstrap lower bounds."
  total_runs: 6
  trajectory:
    - run_id: "smoke_cpu_001"
      hypothesis: "H0/H1 pipeline"
      metric_value: null
      delta: null
      wall_time_min: 0.35
      change_summary: "Non-inferential 2-instance end-to-end smoke across six distributions."
      timestamp: "2026-08-02"
    - run_id: "crossdist-code-transfer-20260803-072321"
      hypothesis: "H0/H1"
      metric_value: "Reliability 6/6; uniform-only kNN OOD success 1/5"
      delta: "H0 rejected; H1 rejected under its locked uniform-source kNN rule"
      wall_time_min: 0.38
      change_summary: "64 instances per distribution, 32 codes, 4 replicas on g51 GPU 3; dedicated result branch f4b38a7."
      timestamp: "2026-08-03"
    - run_id: "multisource-confirm-20260803-073235"
      hypothesis: "H1b"
      metric_value: "6/6 held-out distributions passed; 0/6 significantly negative"
      delta: "Independent fresh-seed confirmation of multi-source transfer"
      wall_time_min: 0.17
      change_summary: "Leave-one-distribution-out mean-code selection on seed 20260804; dedicated result branch df393a1."
      timestamp: "2026-08-03"
    - run_id: "full-lns-transfer-20260803-074321"
      hypothesis: "H3"
      metric_value: "Final 0/6; anytime AUC 0/6; significant harm 4/6"
      delta: "Rejected static multi-source single-code transfer for iterative LNS"
      wall_time_min: 2.02
      change_summary: "24 fresh instances/distribution, 200 iterations, equal 32-rollout budget; dedicated result branch 1c0c177."
      timestamp: "2026-08-03"
    - run_id: "portfolio-lns-transfer-20260803-075100"
      hypothesis: "H4 infrastructure"
      metric_value: null
      delta: null
      wall_time_min: 0.02
      change_summary: "Failed before computation due stale strategy-count constant; logs published as failed result branch 3c66af4."
      timestamp: "2026-08-03"
    - run_id: "portfolio-lns-transfer-20260803-075441"
      hypothesis: "H4"
      metric_value: "Final 0/6; anytime AUC 0/6; significant primary harm 6/6"
